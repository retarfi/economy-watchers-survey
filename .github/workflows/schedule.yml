name: Scheduled Update
on:
  schedule:
    - cron: '0 11 7-20 * *'
  workflow_dispatch:

jobs:
  update:
    name: Update
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Get next version
      id: get_version
      run: |
        echo "VERSION=`date -d "$(date '+%Y%m01') 1 month ago" "+%Y.%m"`.0" >> $GITHUB_OUTPUT
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install poetry!=2.1.0
        poetry install
    - name: Crawl
      run: |
        poetry run python -m src.economy_watchers_survey.crawl
        poetry run python -m src.economy_watchers_survey.create_json
    - name: Check release data
      id: release_data
      env:
        VERSION: ${{ steps.get_version.outputs.VERSION }}
      run: |
        IFS='.' read -r year month patch <<< "$VERSION"
        for file in \
          "data/watcher/$year/${year}${month}_watcher4.csv" \
          "data/watcher/$year/${year}${month}_watcher5.csv" \
          "data/current/${year}${month}.json" \
          "data/future/${year}${month}.json"
        do
          if [ ! -s "$file" ]; then
            echo "::notice::Release data is not ready: $file is missing or empty"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        done
        echo "ready=true" >> "$GITHUB_OUTPUT"
    - name: Bump version
      if: steps.release_data.outputs.ready == 'true'
      env:
        VERSION: ${{ steps.get_version.outputs.VERSION }}
      run: |
        poetry version "$VERSION"
        printf '__version__ = "%s"\n' "$VERSION" > src/economy_watchers_survey/version.py
    - name: Diff
      id: diff
      if: steps.release_data.outputs.ready == 'true'
      run: |
        git add -N .
        git diff --name-only --exit-code
      continue-on-error: true
    - name: Make PR
      id: cpr
      uses: peter-evans/create-pull-request@v8
      with:
        title: Add ${{ steps.get_version.outputs.VERSION }} data
        branch: release/${{ steps.get_version.outputs.VERSION }}
        base: main
        commit-message: Add ${{ steps.get_version.outputs.VERSION }} data
        token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      if: steps.diff.outcome == 'failure'
    # Auto-merge relies on repository settings that are not stored in code:
    #   - Settings > General: "Allow auto-merge" and "Allow merge commits"
    #   - Branch protection for main: require the Build, lint and Monthly data validation checks
    # Validating here as well keeps a bad PR unmerged even if those settings are missing.
    - name: Validate and enable auto-merge
      if: steps.cpr.outputs.pull-request-number != ''
      env:
        GH_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
        PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        PR_HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
        VERSION: ${{ steps.get_version.outputs.VERSION }}
      run: |
        git fetch --no-tags origin "$PR_HEAD_SHA"
        python -m utils.validate_monthly_update --base origin/main --head "$PR_HEAD_SHA" --version "$VERSION"
        gh pr merge "$PR_NUMBER" --auto --merge --match-head-commit "$PR_HEAD_SHA"

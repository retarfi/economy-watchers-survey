name: Build test

on:
  create:
  push:
    branches: [ main, dev, release/* ]
  pull_request:
    branches: [ main, dev, release/* ]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install -r utils/requirements-hf.txt
    - name: Download from HuggingFace datasets
      run: |
        hf auth login --token ${{ secrets.HUGGING_FACE_SECRET }}
        hf download retarfi/economy-watchers-survey --local-dir hf --repo-type dataset
    - name: Build test
      run: |
        sudo apt install -y jq
        bash utils/build.sh
